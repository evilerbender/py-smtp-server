[project]
name = "py-smtp-server"
version = "0.1.0"
description = "Standalone Python SMTP server using aiosmtpd"
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.4",
    "requests>=2.31.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
python-preference = "managed"
native-tls = true
